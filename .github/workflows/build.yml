name: Build desktop installers

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            artifact-name: kinetix-macos-universal
            artifact-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: kinetix-windows-x64
            artifact-path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Provision ffmpeg sidecar (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries

          # Download arm64 ffmpeg
          curl -L -o /tmp/ffmpeg-arm64.zip https://www.osxexperts.net/ffmpeg711arm.zip
          unzip /tmp/ffmpeg-arm64.zip -d /tmp/ffmpeg-arm64/

          # Download x86_64 ffmpeg
          curl -L -o /tmp/ffmpeg-x64.zip https://evermeet.cx/ffmpeg/getrelease/zip
          unzip /tmp/ffmpeg-x64.zip -d /tmp/ffmpeg-x64/

          # Combine into a universal binary using lipo
          lipo -create \
            /tmp/ffmpeg-arm64/ffmpeg \
            /tmp/ffmpeg-x64/ffmpeg \
            -output src-tauri/binaries/ffmpeg-universal-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin
          # Also provide arch-specific names Tauri may resolve during aarch64 sub-build
          cp src-tauri/binaries/ffmpeg-universal-apple-darwin src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp src-tauri/binaries/ffmpeg-universal-apple-darwin src-tauri/binaries/ffmpeg-x86_64-apple-darwin

      - name: Provision whisper sidecar (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries src-tauri/models
          # Build whisper-cli from source (static, no Metal, arm64)
          brew install cmake
          # Pinned to whisper.cpp v1.9.1 (commit f049fff9) for reproducible builds
          # — an unpinned master could silently change CMake flags or behavior.
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-cpp
          cd /tmp/whisper-cpp
          cmake -B build-static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-static --config Release --target whisper-cli -j$(sysctl -n hw.logicalcpu)
          # x86_64 slice: GGML_NATIVE=OFF is load-bearing — it stops GGML from
          # detecting the CI runner's CPU and baking in whatever it has. The
          # actual crash cause identified on a real end-user machine was AVX-512
          # (a runner with AVX-512 producing a binary that faults with
          # STATUS_ILLEGAL_INSTRUCTION on any CPU without it), NOT AVX2 — so we
          # pin an explicit baseline that enables AVX/AVX2/FMA/F16C (all honored
          # here — AppleClang, not MSVC) but keeps AVX512=OFF. AVX2 (not just AVX)
          # is what restores near-original transcription speed. Safe on any Intel
          # Mac with a Haswell-or-newer CPU (~mid-2013 onward); AVX-512 is never
          # emitted, so it can't crash on the AVX-512-less Intel Macs either.
          # Tradeoff: drops pre-~2013 Intel Macs (Sandy/Ivy Bridge — AVX but no
          # AVX2). Mirrors the Windows slice. Keep in sync with binaries/README.md.
          cmake -B build-x64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_AVX512=OFF
          cmake --build build-x64 --config Release --target whisper-cli -j$(sysctl -n hw.logicalcpu)
          # Combine arm64 and x86_64 whisper into a universal binary
          lipo -create \
            build-static/bin/whisper-cli \
            build-x64/bin/whisper-cli \
            -output "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin"
          chmod +x \
            "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin"
          cp "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin" \
             "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-aarch64-apple-darwin"
          cp "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin" \
             "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-x86_64-apple-darwin"
          # Download base.en model
          curl -L -o "$GITHUB_WORKSPACE/src-tauri/models/ggml-base.en.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"

      - name: Provision ffmpeg sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg-win.zip"
          Expand-Archive -Path "$env:TEMP\ffmpeg-win.zip" -DestinationPath "$env:TEMP\ffmpeg-windows" -Force
          $ffmpegExe = Get-ChildItem -Path "$env:TEMP\ffmpeg-windows" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Provision whisper sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/models | Out-Null
          # Build whisper-cli from source (static, no GPU, Windows)
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # Pinned to whisper.cpp v1.9.1 (commit f049fff9) for reproducible builds
          # — an unpinned master could silently change CMake flags or behavior.
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git C:\whisper-cpp
          cd C:\whisper-cpp
          # GGML_NATIVE=OFF is load-bearing: without it GGML detects the CI
          # runner's CPU and bakes in whatever it has. The actual crash cause,
          # confirmed on a real end-user machine (Intel Core i3-12100F / Alder
          # Lake), was AVX-512 — Intel fuses AVX-512 OFF on all Alder Lake
          # consumer chips, so a runner-native binary built with AVX-512 faults
          # with STATUS_ILLEGAL_INSTRUCTION (0xC000001D) there. It was NOT AVX2:
          # the i3-12100F fully supports AVX/AVX2/FMA/F16C (standard since ~2013).
          # So pin an explicit baseline that ENABLES AVX/AVX2/FMA/F16C and keeps
          # only AVX512=OFF:
          #   AVX2=ON (not just AVX) -> restores near-original transcription speed.
          #   AVX512=OFF             -> the actual crash instruction set, absent on
          #                             this and many consumer CPUs (all Alder Lake).
          # On MSVC, ggml only defines GGML_FMA/GGML_F16C for NOT MSVC, so those
          # two flags are inert here — but AVX2=ON implies FMA+F16C on MSVC, so
          # they're enabled anyway. Tradeoff vs. the prior AVX-only build: AVX2
          # drops pre-~2013 CPUs (Sandy/Ivy Bridge) and pre-~2015 AMD, plus
          # low-power Atom/Goldmont chips that have AVX but not AVX2. Single static
          # exe, no multi-variant DLL dispatch (GGML_CPU_ALL_VARIANTS) — that
          # requires BUILD_SHARED_LIBS + GGML_BACKEND_DL and carries an unresolved
          # silent-load-failure bug on Windows/MSVC (whisper.cpp issue #2963).
          # Keep in sync with binaries/README.md.
          cmake -B build-static `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=ON `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_AVX512=OFF
          cmake --build build-static --config Release --target whisper-cli
          Copy-Item -Path "C:\whisper-cpp\build-static\bin\Release\whisper-cli.exe" `
            -Destination "$env:GITHUB_WORKSPACE\src-tauri\binaries\whisper-x86_64-pc-windows-msvc.exe"
          # Download base.en model
          Invoke-WebRequest `
            -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin" `
            -OutFile "$env:GITHUB_WORKSPACE\src-tauri\models\ggml-base.en.bin"

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30
