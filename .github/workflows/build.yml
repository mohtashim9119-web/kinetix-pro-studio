name: Build desktop installers

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            artifact-name: kinetix-macos-universal
            artifact-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: kinetix-windows-x64
            artifact-path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Provision ffmpeg sidecar (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries

          # Download arm64 ffmpeg
          curl -L -o /tmp/ffmpeg-arm64.zip https://www.osxexperts.net/ffmpeg711arm.zip
          unzip /tmp/ffmpeg-arm64.zip -d /tmp/ffmpeg-arm64/

          # Download x86_64 ffmpeg
          curl -L -o /tmp/ffmpeg-x64.zip https://evermeet.cx/ffmpeg/getrelease/zip
          unzip /tmp/ffmpeg-x64.zip -d /tmp/ffmpeg-x64/

          # Combine into a universal binary using lipo
          lipo -create \
            /tmp/ffmpeg-arm64/ffmpeg \
            /tmp/ffmpeg-x64/ffmpeg \
            -output src-tauri/binaries/ffmpeg-universal-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin
          # Also provide arch-specific names Tauri may resolve during aarch64 sub-build
          cp src-tauri/binaries/ffmpeg-universal-apple-darwin src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp src-tauri/binaries/ffmpeg-universal-apple-darwin src-tauri/binaries/ffmpeg-x86_64-apple-darwin

      - name: Provision whisper sidecar (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries src-tauri/models
          # Build whisper-cli from source (static, no Metal, arm64)
          brew install cmake
          # Pinned to whisper.cpp v1.9.1 (commit f049fff9) for reproducible builds
          # — an unpinned master could silently change CMake flags or behavior.
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-cpp
          cd /tmp/whisper-cpp
          cmake -B build-static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-static --config Release --target whisper-cli -j$(sysctl -n hw.logicalcpu)
          # x86_64 slice: GGML_NATIVE=OFF is load-bearing — it stops GGML from
          # detecting the CI runner's CPU and baking in whatever it has. The
          # actual crash cause identified on a real end-user machine was AVX-512
          # (a runner with AVX-512 producing a binary that faults with
          # STATUS_ILLEGAL_INSTRUCTION on any CPU without it), NOT AVX2 — so we
          # pin an explicit baseline that enables AVX/AVX2/FMA/F16C (all honored
          # here — AppleClang, not MSVC) but keeps AVX512=OFF. AVX2 (not just AVX)
          # is what restores near-original transcription speed. Safe on any Intel
          # Mac with a Haswell-or-newer CPU (~mid-2013 onward); AVX-512 is never
          # emitted, so it can't crash on the AVX-512-less Intel Macs either.
          # Tradeoff: drops pre-~2013 Intel Macs (Sandy/Ivy Bridge — AVX but no
          # AVX2). Mirrors the Windows slice. Keep in sync with binaries/README.md.
          cmake -B build-x64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_AVX512=OFF
          cmake --build build-x64 --config Release --target whisper-cli -j$(sysctl -n hw.logicalcpu)
          # Combine arm64 and x86_64 whisper into a universal binary
          lipo -create \
            build-static/bin/whisper-cli \
            build-x64/bin/whisper-cli \
            -output "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin"
          chmod +x \
            "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin"
          cp "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin" \
             "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-aarch64-apple-darwin"
          cp "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-universal-apple-darwin" \
             "$GITHUB_WORKSPACE/src-tauri/binaries/whisper-x86_64-apple-darwin"
      - name: Provision onnxruntime dylib (macOS universal x86_64+arm64, for fa-inference)
        # WS2 Step 13 Phase 4.3: LIPO into one universal dylib, not "ship
        # both and select at runtime" — this app's own bundle target for
        # macOS is ALREADY universal-apple-darwin (one fat main executable
        # covering both arches), so a fat onnxruntime dylib at the SAME
        # single filename needs no new runtime arch-selection code: dyld
        # picks the matching slice the same way it already does for the app
        # binary itself. MEASURED locally (2026-08-27, not on this runner):
        # `lipo -create` of the two per-arch v1.23.2 dylibs below produces a
        # 2-slice fat Mach-O (`lipo -info`: "x86_64 arm64") that `dlopen()`s
        # successfully on real Intel hardware; the arm64 slice's own load
        # behavior is unverified (no Apple Silicon hardware available that
        # session) — this CI step is what actually exercises it, since
        # macos-latest GitHub runners are arm64.
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          EXPECTED_SHA256_X64="8c9c78de65ea3786f987c0d980e9c1b13a3a5fbc6b3e2965ba05b450e6e4c054"
          EXPECTED_SHA256_ARM64="d306d2bc768540766c7ed8a1e0ff05d2870c77a934ebeee4a7bafa1b732ef299"
          # No EXPECTED_SHA256_UNIVERSAL hard gate — see the note below the
          # lipo call for why the lipo OUTPUT's exact bytes aren't pinned.
          cd src-tauri/onnxruntime
          curl -L -o onnxruntime-osx-x86_64-1.23.2.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-x86_64-1.23.2.tgz
          curl -L -o onnxruntime-osx-arm64-1.23.2.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-arm64-1.23.2.tgz
          tar -xzf onnxruntime-osx-x86_64-1.23.2.tgz
          tar -xzf onnxruntime-osx-arm64-1.23.2.tgz

          for pair in "onnxruntime-osx-x86_64-1.23.2:$EXPECTED_SHA256_X64" "onnxruntime-osx-arm64-1.23.2:$EXPECTED_SHA256_ARM64"; do
            dir="${pair%%:*}"; expected="${pair##*:}"
            actual="$(shasum -a 256 "$dir/lib/libonnxruntime.1.23.2.dylib" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::onnxruntime dylib sha256 mismatch for $dir: expected $expected, got $actual"
              exit 1
            fi
          done

          lipo -create \
            onnxruntime-osx-x86_64-1.23.2/lib/libonnxruntime.1.23.2.dylib \
            onnxruntime-osx-arm64-1.23.2/lib/libonnxruntime.1.23.2.dylib \
            -output libonnxruntime.1.23.2.dylib
          rm -rf onnxruntime-osx-x86_64-1.23.2 onnxruntime-osx-x86_64-1.23.2.tgz \
                 onnxruntime-osx-arm64-1.23.2 onnxruntime-osx-arm64-1.23.2.tgz

          # NOT hard-pinned against EXPECTED_SHA256_UNIVERSAL (measured
          # locally, kept in onnxruntime.manifest.json for reference only):
          # `lipo`'s exact output bytes are not guaranteed reproducible
          # across Xcode/lipo tool versions even from byte-identical inputs,
          # so treating that hash as a CI hard-gate risks failing a
          # legitimate build over a toolchain difference rather than a real
          # corruption. The two SOURCE dylibs above (Microsoft's own
          # published artifacts) are the real integrity check; this step
          # only verifies the lipo OUTPUT's structure, not its exact bytes.
          ACTUAL_UNIVERSAL_SHA256="$(shasum -a 256 libonnxruntime.1.23.2.dylib | awk '{print $1}')"
          echo "universal dylib sha256 (informational, not gated): $ACTUAL_UNIVERSAL_SHA256"
          ARCHES="$(lipo -info libonnxruntime.1.23.2.dylib)"
          echo "$ARCHES"
          case "$ARCHES" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::lipo output does not report both x86_64 and arm64 slices: $ARCHES"; exit 1 ;;
          esac
          cd "$GITHUB_WORKSPACE"

      - name: Guard against stray dev models being bundled
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # Whisper's model AND every FA model.onnx are acquired in-app
          # (whisper.rs's app_local_data_dir-first resolution;
          # models.rs::import_local_model / fa_model_download) rather than
          # bundled — nothing under src-tauri/models/ or ANY *.onnx anywhere
          # in the working tree that would be picked up by a resource glob
          # should ship. A dev machine's hand-placed ggml-*.bin (the exact
          # mistake that produced the 4.7 GB .app) or a stray model.onnx
          # left under src-tauri/ must fail the build, not silently ship.
          #
          # `find`, not a `**` glob: macos-latest's default /bin/bash is 3.2
          # (Apple has never shipped GPLv3 bash 4+), and bash 3.2 has no
          # `globstar` shell option at all — `shopt -s globstar` itself fails
          # with "invalid shell option name" there, which is what actually
          # broke this step (confirmed: GitHub's own runner-images docs list
          # macOS runners' default shell as bash 3.2; `find -type f` needs no
          # shell option to recurse on any bash version).
          shopt -s nullglob
          stray_bin=(src-tauri/models/*.bin)
          stray_onnx="$(find src-tauri -type f -name '*.onnx')"
          if [ ${#stray_bin[@]} -gt 0 ] || [ -n "$stray_onnx" ]; then
            echo "::error::stray model file(s) that would be bundled: ${stray_bin[*]} $stray_onnx"
            exit 1
          fi

      - name: Provision onnxruntime DLLs (Windows x86_64, for fa-inference)
        # No universal/multi-arch question on Windows (one target,
        # x86_64-pc-windows-msvc) — just download+verify the two DLLs
        # Microsoft's release zip ships (the engine plus its one
        # same-directory dependency) into the SAME onnxruntime/ resources
        # folder tauri.conf.json's existing `"onnxruntime/*": "onnxruntime/"`
        # glob already bundles unconditionally — no tauri.conf.json change
        # needed. UNVERIFIED beyond a checksum match: no Windows hardware
        # available to confirm the dylib actually loads there (tracked in
        # docs/ws2-fa-models/ort-provisioning.md alongside the MSVC
        # redistributable prerequisite note).
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedEngine = "dec964ab1ee36cc9b0ae247d13b376627992fc57dec0454354017ab8fd84f1ea"
          $expectedShared = "a2b3a50956aa75a9879c8472bc7df4f7a8072bcd2db19a1b7d988e7688f293ef"
          New-Item -ItemType Directory -Force -Path src-tauri/onnxruntime | Out-Null
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-win-x64-1.23.2.zip" -OutFile "$env:TEMP\ort-win.zip"
          Expand-Archive -Path "$env:TEMP\ort-win.zip" -DestinationPath "$env:TEMP\ort-windows" -Force
          $engineSrc = Get-ChildItem -Path "$env:TEMP\ort-windows" -Filter "onnxruntime.dll" -Recurse | Select-Object -First 1
          $sharedSrc = Get-ChildItem -Path "$env:TEMP\ort-windows" -Filter "onnxruntime_providers_shared.dll" -Recurse | Select-Object -First 1
          Copy-Item -Path $engineSrc.FullName -Destination "src-tauri/onnxruntime/onnxruntime.dll"
          Copy-Item -Path $sharedSrc.FullName -Destination "src-tauri/onnxruntime/onnxruntime_providers_shared.dll"
          $actualEngine = (Get-FileHash "src-tauri/onnxruntime/onnxruntime.dll" -Algorithm SHA256).Hash.ToLower()
          $actualShared = (Get-FileHash "src-tauri/onnxruntime/onnxruntime_providers_shared.dll" -Algorithm SHA256).Hash.ToLower()
          if ($actualEngine -ne $expectedEngine) {
            Write-Error "onnxruntime.dll sha256 mismatch: expected $expectedEngine, got $actualEngine"
            exit 1
          }
          if ($actualShared -ne $expectedShared) {
            Write-Error "onnxruntime_providers_shared.dll sha256 mismatch: expected $expectedShared, got $actualShared"
            exit 1
          }

      - name: Provision ffmpeg sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg-win.zip"
          Expand-Archive -Path "$env:TEMP\ffmpeg-win.zip" -DestinationPath "$env:TEMP\ffmpeg-windows" -Force
          $ffmpegExe = Get-ChildItem -Path "$env:TEMP\ffmpeg-windows" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Provision whisper sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/models | Out-Null
          # Build whisper-cli from source (static, no GPU, Windows)
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # Pinned to whisper.cpp v1.9.1 (commit f049fff9) for reproducible builds
          # — an unpinned master could silently change CMake flags or behavior.
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git C:\whisper-cpp
          cd C:\whisper-cpp
          # GGML_NATIVE=OFF is load-bearing: without it GGML detects the CI
          # runner's CPU and bakes in whatever it has. The actual crash cause,
          # confirmed on a real end-user machine (Intel Core i3-12100F / Alder
          # Lake), was AVX-512 — Intel fuses AVX-512 OFF on all Alder Lake
          # consumer chips, so a runner-native binary built with AVX-512 faults
          # with STATUS_ILLEGAL_INSTRUCTION (0xC000001D) there. It was NOT AVX2:
          # the i3-12100F fully supports AVX/AVX2/FMA/F16C (standard since ~2013).
          # So pin an explicit baseline that ENABLES AVX/AVX2/FMA/F16C and keeps
          # only AVX512=OFF:
          #   AVX2=ON (not just AVX) -> restores near-original transcription speed.
          #   AVX512=OFF             -> the actual crash instruction set, absent on
          #                             this and many consumer CPUs (all Alder Lake).
          # On MSVC, ggml only defines GGML_FMA/GGML_F16C for NOT MSVC, so those
          # two flags are inert here — but AVX2=ON implies FMA+F16C on MSVC, so
          # they're enabled anyway. Tradeoff vs. the prior AVX-only build: AVX2
          # drops pre-~2013 CPUs (Sandy/Ivy Bridge) and pre-~2015 AMD, plus
          # low-power Atom/Goldmont chips that have AVX but not AVX2. Single static
          # exe, no multi-variant DLL dispatch (GGML_CPU_ALL_VARIANTS) — that
          # requires BUILD_SHARED_LIBS + GGML_BACKEND_DL and carries an unresolved
          # silent-load-failure bug on Windows/MSVC (whisper.cpp issue #2963).
          # Keep in sync with binaries/README.md.
          cmake -B build-static `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=ON `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_AVX512=OFF
          cmake --build build-static --config Release --target whisper-cli
          Copy-Item -Path "C:\whisper-cpp\build-static\bin\Release\whisper-cli.exe" `
            -Destination "$env:GITHUB_WORKSPACE\src-tauri\binaries\whisper-x86_64-pc-windows-msvc.exe"
          # No model download here: the whisper model is acquired in-app (see
          # whisper.rs's app_local_data_dir-first resolution), not bundled.

      - name: Guard against stray dev models being bundled (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $strayBin = Get-ChildItem -Path "src-tauri/models" -Filter "*.bin" -ErrorAction SilentlyContinue
          $strayOnnx = Get-ChildItem -Path "src-tauri" -Filter "*.onnx" -Recurse -ErrorAction SilentlyContinue
          $stray = @($strayBin) + @($strayOnnx)
          if ($stray.Count -gt 0) {
            Write-Error "stray model file(s) that would be bundled: $($stray.Name -join ', ')"
            exit 1
          }

      - name: Build Tauri app
        # -f fa-inference: compile forced alignment in for the shipped
        # installer (A1). Chosen over a Cargo.toml `default = [...]` feature
        # so `cargo check`/`cargo test` from src-tauri/ and the fa-ort-matrix
        # workflow's feature-off cell stay feature-off by default — only the
        # release packaging path opts in, matching the existing
        # `tauri:dev:fa` (`tauri dev -f fa-inference`) precedent in
        # package.json. `ort`'s load-dynamic mode means this compiles cleanly
        # on both targets with no onnxruntime dylib required at build time.
        run: npm run tauri:build -- --target ${{ matrix.target }} -f fa-inference

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30
