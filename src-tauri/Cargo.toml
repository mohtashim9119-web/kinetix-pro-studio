[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.15", features = ["tokio"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-shell = "2"

# Optional: real ONNX forward pass for forced alignment (WS1 Task 5, Slice D2).
# default-features = false + no api-NN feature keeps ort's own onnxruntime
# minor-version floor at 17 (see docs/ws1-sync-pipeline/measurements/
# runtime-unblock-2026-08-12.md) — the default api-27 feature would require
# onnxruntime >=1.27, and no macOS x86_64 onnxruntime build exists past
# 1.23.2. load-dynamic resolves the onnxruntime C library at runtime via
# ORT_DYLIB_PATH; nothing is vendored or downloaded by this crate.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic"] }
# Parses fa_onnx.rs's embedded fa-vocab-*.json fixtures at runtime, and (as of
# WS1 Task 5 Slice D3) fa/text.rs's caller-supplied vocab JSON — the latter is
# UNCONDITIONAL (not behind fa-inference), so this is a plain dependency, not
# an optional one gated by a feature. Already resolved in this workspace's
# dependency graph (transitively via tauri) at the identical "1.0" constraint
# this crate now depends on directly — this adds no new package to
# Cargo.lock, only a direct edge to an already-present one.
serde_json = "1.0"

[dev-dependencies]
# WS1 Task 5 Slice D25 A1 — `tauri::test::mock_context`/`noop_assets` build a
# `Context<R>` with an EMPTY window list, generic over the runtime `R`. Used
# by `tests/fa_durable_wav_live.rs` with `R = tauri::Wry` (the REAL runtime,
# not `MockRuntime`) — `fa_align_dev`/`ensure_durable_wav`'s own signatures
# are hardcoded to `AppHandle<Wry>` (tauri's `#[default_runtime]` macro), and
# `whisper.rs::transcode_to_wav` (unmodified, protected this slice) is too,
# so only a REAL Wry `AppHandle` can reach them — `mock_context`'s empty
# window list means `Builder::<Wry>::build()` never needs to create an actual
# webview/window to get one. `test = []` on tauri's own Cargo.toml declares
# zero additional dependencies, so this adds no new package to Cargo.lock
# (verified: `cargo check --tests` after this change left Cargo.lock
# byte-identical). Scoped to `[dev-dependencies]`, not `[dependencies]`, so
# the feature is unreachable in a release build.
tauri = { version = "2.11.2", features = ["test"] }

[features]
# Opt-in devtools in a RELEASE build. Tauri's own
# `open_devtools`/`close_devtools`/`is_devtools_open` are gated on
# `any(debug_assertions, feature = "devtools")` — of *tauri's* feature — so
# `lib.rs`'s `toggle_devtools` needs a matching feature on THIS crate for its own
# cfg to mean anything. Without this declaration the cfg is always false in
# release and cargo warns about an unexpected feature name.
#
# Not enabled by default: a shipped build should not carry the inspector unless
# someone asks for it (`cargo build --features devtools`). Debug builds get
# devtools regardless, via `debug_assertions`.
devtools = ["tauri/devtools"]

# Real ONNX forward pass for forced alignment (WS1 Task 5, Slice D2). OFF by
# default — with this feature disabled, `ort` is entirely absent from the
# build graph and the crate compiles/behaves exactly as it did before this
# slice. See fa.rs / fa_onnx.rs for the feature-gated inference code.
fa-inference = ["dep:ort"]

# WS1 Task 5 Slice D25 A1 — live, real-`AppHandle` durable-cache probe.
# `harness = false`: this file's own `main()` (not `#[test]` functions run
# under libtest's worker threads) runs directly on the process's actual OS
# main thread, which the real Wry runtime's `EventLoop::new()` requires on
# macOS. Self-gated inside `main()` on an env var + the real corpus audio's
# presence (mirrors this codebase's own `ORT_REQUIRE`/`ort_dylib_or_skip`
# skip convention) — a plain `cargo test` sweep still builds this target but
# exits immediately without touching the filesystem or the Wry runtime.
[[test]]
name = "fa_durable_wav_live"
path = "tests/fa_durable_wav_live.rs"
harness = false
